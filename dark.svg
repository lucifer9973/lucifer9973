  <style>
    .ascii{font: 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:url(#accent);letter-spacing:.35px;filter:url(#softGlow)}
    .kicker{font:600 15px Inter,Segoe UI,sans-serif;fill:#94A3B8;letter-spacing:2px}
    .name{font:700 48px Inter,Segoe UI,sans-serif;fill:#F8FAFC;letter-spacing:-1.5px}
    .role{font:600 25px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:url(#accent)}
    .detail{font:500 15px Inter,Segoe UI,sans-serif;fill:#94A3B8}
    .accent{font:700 17px ui-monospace,monospace;fill:#22D3EE}
    .pill{fill:#0B1120;stroke:#243047;stroke-width:1}
    .pilltext{font:600 12px Inter,Segoe UI,sans-serif;fill:#F8FAFC}
    .tiny{font:500 12px ui-monospace,monospace;fill:#94A3B8}
  </style>
</defs>

